<title>Figure 2 Incremental AUROC</title><desc>Forest plot of six paired AUROC increments for logistic and gradient-boosting models after adding pooled factor 2, temporal factor 5, or both. Joint-factor intervals cross zero in both families. The small temporal-only logistic interval is positive, whereas the corresponding gradient-boosting interval crosses zero.</desc>
