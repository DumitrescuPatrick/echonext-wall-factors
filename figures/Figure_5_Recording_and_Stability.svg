<title>Figure 5 Recording and Stability</title><desc>Two panels contrast input sensitivity with estimator stability. A synchronized 100-millisecond shift changes pooled and temporal scores by RMS values of 0.431 and 0.645 training standard deviations. Separately, patient-bootstrap PCA refits on frozen features yield high matched monitoring-score correlations. The encoder was not retrained.</desc>
